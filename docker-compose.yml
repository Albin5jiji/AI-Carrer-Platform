services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: career_platform
      POSTGRES_USER: career_user
      POSTGRES_PASSWORD: career_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_user -d career_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://career_user:career_pass@postgres:5432/career_platform
      JWT_SECRET_KEY: review-one-local-secret
      CORS_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
